<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students Result Table</title>
    <style>

    body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        margin: 0;
        padding: 40px;
    }

    h1 {
        text-align: center;
        color: #2563eb;
    }
table {
    width: 80%;
    margin: 20px auto;
    border-collapse: collapse;
    background-color: white;
}
th,
td {
    border: 1px solid #bfdbfe;
    padding: 12px;
    text-align: center;
}
th {
    background-color: #2563eb;
    color: white;
}
tr:hover {
    background-color: #eff6ff;
}
a {
    display: block;
    width: 200px;
    margin: 25px auto 0;
    text-align: center;
    background-color: #2563eb;
    color: white;
    padding: 10px 18px;
    text-decoration: none;
    border-radius: 5px;
}

a:hover {
    background-color: #1f2937;
}
@media (max-width: 600px) {

    body {
        padding: 20px 10px;
    }

    h1 {
        font-size: 28px;
    }

    table {
        width: 100%;
        font-size: 16px;
    }

    th,
    td {
        padding: 10px 6px;
    }

    a {
        width: 100%;
        font-size: 17px;
        padding: 12px 18px;
    }
}
</style>
</head>

<body>

    <h1>Students Result Table</h1>

    <hr>

    <table border="1">

        <tr>
            <th>Name</th>
            <th>Roll</th>
            <th>Class</th>
            <th>Result</th>
        </tr>

        <tr>
            <td>Shohag Sarker</td>

        </tr>

        <tr>
            <td>Rahim</td>
            <td>02</td>
            <td>HSC</td>
            <td>A</td>
        </tr>

        <tr>
            <td>Karim</td>
            <td>03</td>
            <td>HSC</td>
            <td>A-</td>
        </tr>

    </table>

</body>

</html>
